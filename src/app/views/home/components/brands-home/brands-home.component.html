<section class="vitamin-brands" aria-label="Marcas disponibles">
  <div class="vitamin-marquee">
    <div class="vitamin-marquee__track">
      @for (copy of copies; track copy) {
        <div class="vitamin-marquee__group" [attr.aria-hidden]="copy === 1 ? 'true' : null">
          @for (brand of brands; track brand.id) {
            <a [href]="brand.link" class="vitamin-logo" [class.vitamin-logo--small]="brand.small" [attr.aria-label]="copy === 0 ? 'Ver productos de ' + brand.name : null" [attr.tabindex]="copy === 1 ? -1 : null">
              <img [src]="brand.image" [alt]="copy === 0 ? brand.name : ''">
            </a>
          }
        </div>
      }
    </div>
  </div>
</section>
