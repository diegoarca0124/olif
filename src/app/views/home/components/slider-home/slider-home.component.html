<section class="slider-section" aria-label="Promociones destacadas">
  <div class="slider-container">
    <swiper-container
      slides-per-view="1"
      loop="true"
      autoplay-delay="5000"
      autoplay-disable-on-interaction="false"
      effect="fade"
      fade-effect-cross-fade="true"
      pagination="true"
      navigation="true"
      [injectStyles]="swiperStyles"
    >
      @for (slide of slides; track slide.image) {
        <swiper-slide>
          <img
            class="slide-image"
            [src]="slide.image"
            [alt]="slide.alt"
          >
        </swiper-slide>
      }
    </swiper-container>
  </div>
</section>
