<section class="olif-slider" aria-label="Promociones destacadas">
  <div class="olif-slider__viewport">
    <article class="olif-slide is-active">
      <img
        src="./assets/slider/slide-01.webp"
        alt="Vitaminas y suplementos seleccionados"
      >

      <div class="olif-slide__overlay"></div>

      <div class="olif-slide__content">
        <p>Bienestar todos los días</p>
        <h1>Cuida de ti,<br>naturalmente.</h1>

        <a href="categoria.html?categoria=vitaminas">
          Ver vitaminas
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </article>

    <article class="olif-slide">
      <img
        src="./assets/slider/slide-02.webp"
        alt="Alimentos saludables para tu rutina"
      >

      <div class="olif-slide__overlay"></div>

      <div class="olif-slide__content">
        <p>Una elección más simple</p>
        <h2>Alimentos que<br>se sienten bien.</h2>

        <a href="categoria.html?categoria=alimentos">
          Ver alimentos
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </article>

    <article class="olif-slide">
      <img
        src="./assets/slider/slide-03.webp"
        alt="Productos para el cuidado personal"
      >

      <div class="olif-slide__overlay"></div>

      <div class="olif-slide__content">
        <p>Cuidado para tu vida real</p>
        <h2>Tu rutina,<br>a tu manera.</h2>

        <a href="categoria.html?categoria=cuidado-personal">
          Ver cuidado personal
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </article>
  </div>

  <div class="olif-slider__controls">
    <button
      class="olif-slider__arrow olif-slider__previous"
      type="button"
      aria-label="Diapositiva anterior"
    >
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="olif-slider__dots" aria-label="Seleccionar diapositiva"></div>

    <button
      class="olif-slider__arrow olif-slider__next"
      type="button"
      aria-label="Siguiente diapositiva"
    >
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>
  </div>

  <div class="olif-slider__progress" aria-hidden="true">
    <span></span>
  </div>
