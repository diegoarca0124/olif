<section
  class="shipping"
  aria-labelledby="shippingTitle"
>
  <div class="shipping__container">
    <header class="shipping__header">
      <p class="shipping__eyebrow">
        Envío local
      </p>

      <h2 id="shippingTitle">
        Envío <span style="color: #fed201;">gratis</span> en Lima
      </h2>

      <p class="shipping__description">
        Recibe tus productos Olif sin costo de envío en nuestros distritos
        seleccionados.
      </p>

      <a
        href="https://wa.me/51900000000"
        target="_blank"
        rel="noopener noreferrer"
        class="shipping__button"
        (mouseenter)="showButtonEffect($event)"
        (mouseleave)="hideButtonEffect($event)"
        (focus)="showButtonEffect($event)"
        (blur)="hideButtonEffect($event)"
      >
        <span
          class="shipping__button-fill"
          aria-hidden="true"
        ></span>

        <span class="shipping__button-label">
          Consultar cobertura
        </span>

        <ion-icon
          class="shipping__button-arrow"
          name="arrow-forward-outline"
          aria-hidden="true"
        ></ion-icon>
      </a>
    </header>

    <div
      class="shipping__divider"
      aria-hidden="true"
    ></div>

    <div
      class="shipping__districts"
      aria-label="Distritos con envío gratuito"
    >
      @for (
        district of districts;
        track district
      ) {
        <span class="shipping__district">
          {{ district }}
        </span>
      }
    </div>

    <!-- <p class="shipping__note">
      Envío gratuito sujeto a condiciones y monto mínimo de compra.
    </p> -->
  </div>
</section>
