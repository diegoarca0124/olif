<section class="discover-section" id="discover" aria-labelledby="discoverTitle">
  <div class="container-fluid">
    <div class="discover-heading">
      <div>
        <p class="discover-eyebrow fs-8 text-gray-500">
          Explora y descubre
        </p>

        <h2 id="discoverTitle" class="fw-700 text-gray-800">
          Nuestras <br>
          categorías
        </h2>
      </div>

      <a
        routerLink="/productos"
        class="categories__button"
        (mouseenter)="showButtonEffect($event)"
        (mouseleave)="hideButtonEffect($event)"
        (focus)="showButtonEffect($event)"
        (blur)="hideButtonEffect($event)"
      >
        <span
          class="categories__button-fill"
          aria-hidden="true"
        ></span>

        <span class="categories__button-label">
          Ver todos
        </span>

        <ion-icon
          class="categories__button-arrow"
          name="arrow-forward-outline"
          aria-hidden="true"
        ></ion-icon>
      </a>
    </div>

    <div class="story-grid">
      @for (category of categories; track category.id) {
        <a
          [class]="'story-card ' + category.colorClass"
          [routerLink]="category.link"
          [attr.aria-label]="'Ver productos de ' + category.name"
          [style.background-color]="category.bg"
          [style.color]="category.color"
        >
          <div class="story-content">
            <h3>{{ category.name }}</h3>
            <p>{{ category.description }}</p>
          </div>

          <img
            class="story-image"
            [src]="category.image"
            [alt]="category.alt"
            loading="lazy"
          >

          <span class="story-link">
            Ver categoría
            <span aria-hidden="true">→</span>
          </span>
        </a>
      }
    </div>
  </div>
</section>
