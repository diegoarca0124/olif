name: Deploy Olif to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: olif-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build

      - name: Verificar compilación
        run: |
          test -f dist/olif/browser/index.html
          ls -la dist/olif/browser

      - name: Configurar conexión SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Publicar en el VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            --human-readable \
            --exclude=".gitkeep" \
            -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT" \
            dist/olif/browser/ \
            "$VPS_USER@$VPS_HOST:/var/www/olif/"